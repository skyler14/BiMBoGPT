[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bimbogpt"
version = "0.1.0"
description = "Babble In Means Better Out - Drop-in OpenAI wrapper that injects babble priming"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
bimbogpt = "bimbogpt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
